name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", LICENSE]
  pull_request:
    paths-ignore: ["**.md", LICENSE]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on pull requests only; every run on main finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Lint, test and build
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # As production during the beta (#23): the e2e, axe and Lighthouse checks cover the banner.
      - run: npm run build
        env:
          SITE_STAGE: beta

      - name: Install Chromium for Playwright
        run: npm run test:e2e:install

      - run: npm run test:e2e

      # Budgets in lighthouserc.cjs: both languages, mobile, median of three runs (#7).
      - name: Lighthouse
        run: npm run test:lighthouse
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
